spring.application.name=gastornis-backend

# Local dev default connects to localhost MySQL. On Render, set DB_URL as an
# env var to your TiDB Serverless connection string instead, e.g.:
# jdbc:mysql://<gateway-host>:4000/gastornis_db?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gastornis_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS: comma-separated list of allowed frontend origins. Defaults to local
# dev; on Render, set ALLOWED_ORIGINS to your deployed frontend URL(s).
gastornis.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# ========================================
# EMAIL CONFIGURATION — Brevo HTTPS API
# ========================================
# Render's free tier blocks outbound SMTP entirely (all ports), so we send
# email over Brevo's HTTPS API instead of Gmail SMTP.
#
# GASTORNIS_MAIL_USERNAME is still your own Gmail address — it's just the
# email that gets the enquiry notifications now, not an SMTP login.
# BREVO_API_KEY comes from your free Brevo account (Settings -> SMTP & API).
gastornis.notify-email=${GASTORNIS_MAIL_USERNAME}
brevo.api-key=${BREVO_API_KEY}