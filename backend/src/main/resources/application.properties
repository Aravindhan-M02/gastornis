spring.application.name=gastornis-backend

# Local dev default connects to localhost MySQL. On Render, set DB_URL as an
# env var to your TiDB Serverless connection string instead, e.g.:
# jdbc:mysql://<gateway-host>:4000/gastornis_db?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gastornis_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS: comma-separated list of allowed frontend origins. Defaults to local
# dev; on Render, set ALLOWED_ORIGINS to your deployed frontend URL(s).
gastornis.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# ========================================
# EMAIL CONFIGURATION
# ========================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${GASTORNIS_MAIL_USERNAME}
spring.mail.password=${GASTORNIS_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Prevent mail connection from hanging indefinitely
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000